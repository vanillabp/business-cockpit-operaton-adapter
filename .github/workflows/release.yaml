name: Release
# Publishes to Maven Central through the release parent's 'release' and 'central-portal'
# profiles. Everything happens on a release branch, so main is never carrying a released
# version.
#
# No snapshot comes out of a release here. The Business Cockpit's release deploys the next
# snapshot to Maven Central before it is done; this one only writes the next version into
# the pull request back into main, and the publish of main deploys the snapshot from there.
"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release (e.g. 0.9.0)"
        required: true
      train:
        description: "Release train, e.g. 2.0. Empty: this release uploads to Maven Central itself. Set: the bundle is kept for release-train.yaml in maven-release-parent. Release the repositories of a train in the order of their dependencies: each release reads the bundles of the releases before it."
        required: false
        default: ""
concurrency:
  # One release of this repository at a time. Two releases at once would deploy the same
  # coordinates to Maven Central, write the same tag and work on the same release branch.
  # GitHub keeps at most one waiting run per group, so a third dispatch while one release
  # runs and one waits ends the waiting one as 'cancelled' without ever starting a job. A
  # release is dispatched by hand, so somebody is there to see that and dispatch again.
  # 'cancel-in-progress: false' protects the run which is already running and nothing
  # else, which is what a release needs: it deploys to Maven Central and pushes a tag,
  # and neither of those survives being cut in half.
  #
  # The publish keeps its own group, so a release and a publish run beside each other.
  # They cannot write the same thing. Both upload through the profile 'central-portal',
  # but a release writes fixed versions and the publish of main writes the snapshot.
  group: business-cockpit-operaton-adapter-release
  cancel-in-progress: false
permissions:
  contents: write
env:
  # release-versions.sh of maven-release-parent at a fixed commit, so a later change of the
  # script cannot break the release of an older branch. A new version of the script comes
  # with a pull request which moves this commit.
  RELEASE_VERSIONS_SH: "https://raw.githubusercontent.com/vanillabp/maven-release-parent/a0a3e691fc99cc80e7a6b87a35b7f7b94a9f6b47/.github/scripts/release-versions.sh"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so the release brings its own 3.9. Remove this step once a plugin
      # version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
          server-id: vanillabp-central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Create the release branch
        run: git checkout -b release/${{ github.event.inputs.release_version }} origin/main
      - name: Set the release version
        run: |
          mvn --batch-mode --no-transfer-progress versions:set \
            -DnewVersion=${{ github.event.inputs.release_version }}
          find . -name pom.xml.versionsBackup -delete
      # A version on Maven Central never changes. Below that line nobody can use this version
      # yet, so the steps at the end may move its tag and reuse its branch and pull request
      # when a release of the same version runs again.
      - name: Refuse a version which Maven Central has already
        env:
          VERSION: "${{ inputs.release_version }}"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/release-versions.sh" "$RELEASE_VERSIONS_SH"
          bash "$RUNNER_TEMP/release-versions.sh" unpublished "$VERSION"
      # A release train builds the bundle of each release and keeps it as an Actions artifact.
      # release-train.yaml in maven-release-parent uploads the bundles of all repositories of
      # a train as one deployment, because Sonatype allows only a few deployments a month.
      # The bundles of the train which are already there go into the local Maven repository,
      # so this build finds the versions which are not on Maven Central yet. See the README
      # of maven-release-parent.
      - name: Read the bundles of the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "main"
          # reads the Actions artifacts of the other repositories, which GITHUB_TOKEN cannot
          GH_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
        run: |
          # the shared part of a release train lives once, in maven-release-parent
          curl -fsSL -o "$RUNNER_TEMP/release-train.sh" \
            https://raw.githubusercontent.com/vanillabp/maven-release-parent/main/.github/scripts/release-train.sh
          bash "$RUNNER_TEMP/release-train.sh" prepare "$TRAIN" "$LINE"
      # main depends on SNAPSHOTs of the platform, the Operaton adapter and the Business
      # Cockpit until those are on Maven Central. The release branch gets their released
      # versions here, from the bundles of the train or from Maven Central. If one is in
      # neither place, the release stops before anything leaves this build, and the message
      # names the repository to release first.
      - name: Use the released versions of VanillaBP
        env:
          TRAIN: "${{ inputs.train }}"
        run: bash "$RUNNER_TEMP/release-versions.sh" raise "$TRAIN"
      # a release must not depend on anything that can still change under it
      - name: No SNAPSHOT dependency is left
        run: |
          if grep -R "SNAPSHOT" --include=pom.xml . ; then
            echo "::error::A SNAPSHOT is left in a POM after the VanillaBP versions were raised, so this release would depend on something unreleased. Release it first and name its version on main:"
            exit 1
          fi
      - name: Build and deploy to Maven Central
        run: mvn --batch-mode --no-transfer-progress
          $TRAIN_ARGS clean deploy -Prelease,central-portal
        env:
          # builds the bundle and does not upload it. '-DskipUpload' is for a POM which
          # configures the plugin without the property of release-parent
          TRAIN_ARGS: "${{ inputs.train != '' && '-Dcentral.skip.upload=true -DskipUpload=true' || '' }}"
          # maven-gpg-plugin 3.2 reads the passphrase from this variable. Passing it as
          # -Dgpg.passphrase is deprecated since 3.2
          MAVEN_GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
      - name: Pack the bundle for the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "main"
          VERSION: "${{ inputs.release_version }}"
        run: bash "$RUNNER_TEMP/release-train.sh" pack "$TRAIN" "$LINE" "$VERSION"
      - name: Keep the bundle for the release train
        if: inputs.train != ''
        uses: actions/upload-artifact@v7
        with:
          # one name per repository and line: a new build of the same line replaces the old
          # one, and release-train.yaml takes the newest
          name: "release-train-${{ inputs.train }}-${{ github.event.repository.name }}-main"
          path: "${{ runner.temp }}/release-train/"
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Commit and tag the release
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          { echo "Prepare release ${{ inputs.release_version }}"; if [ -s "$RUNNER_TEMP/raised-versions.txt" ]; then echo; cat "$RUNNER_TEMP/raised-versions.txt"; fi; } \
            | git commit -a -F -
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            # Maven Central has no artifact of this version, checked before the build, so a
            # release of the same version which runs again may move the tag
            echo "::warning::Tag $VERSION exists already. This release moves it to this build."
            git tag -f -a "$VERSION" -m "Release $VERSION"
            git push --force origin "refs/tags/$VERSION"
          else
            git tag -a "${{ github.event.inputs.release_version }}" \
              -m "Release ${{ github.event.inputs.release_version }}"
            git push origin "${{ github.event.inputs.release_version }}"
          fi
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.release_version }}"
          name: "v${{ github.event.inputs.release_version }}"
          generate_release_notes: true
          draft: true
      - name: Set the next snapshot version
        run: |
          RELEASE_VERSION=${{ github.event.inputs.release_version }}
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          NEXT="$major.$minor.$((patch + 1))-SNAPSHOT"
          mvn --batch-mode --no-transfer-progress versions:set -DnewVersion=$NEXT
          find . -name pom.xml.versionsBackup -delete
          git commit -a -m "Set next version $NEXT"
          if git ls-remote --exit-code --heads origin "release/$VERSION" > /dev/null; then
            echo "::warning::Branch release/$VERSION exists already. This release replaces it with this build."
            git push --force origin "HEAD:release/$VERSION"
          else
            git push origin HEAD:release/${{ github.event.inputs.release_version }}
          fi
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
      - name: Open the pull request back into main
        run: |
          if [ -n "$(gh pr list --head "release/$VERSION" --state open --json number --jq '.[].number')" ]; then
            echo "::warning::The pull request of release/$VERSION is open already. This release reuses it."
            exit 0
          fi
          gh pr create \
            --title "Merge release/${{ github.event.inputs.release_version }} into main" \
            --body "Automated pull request to merge the release branch." \
            --base main \
            --head release/${{ github.event.inputs.release_version }}
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
