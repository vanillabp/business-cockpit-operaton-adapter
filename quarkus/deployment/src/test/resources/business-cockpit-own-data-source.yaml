quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: "jdbc:h2:mem:${c7-cockpit.test.database-name}-application;DB_CLOSE_DELAY=-1"
    engine:
      db-kind: h2
      jdbc:
        url: "jdbc:h2:mem:${c7-cockpit.test.database-name}-engine;DB_CLOSE_DELAY=-1"
        transactions: xa
vanillabp:
  outbox:
    poll-interval: PT0.2S
    attempt-frequency: PT0.2S
  adapters:
    c7:
      type: operaton
      name-clash-avoidance: by-adapter
      data-source-name: engine
  prioritized-adapters:
    - c7
  workflow-modules:
    c7-cockpit:
      adapters:
        c7:
          resources-location: classpath:c7-cockpit/processes
      workflows:
        CockpitProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - signers
          tasks:
            Approve:
              implemented-externally: true
        MultiInstanceProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - signers
          tasks:
            MI_Sign:
              implemented-externally: true
        CalledSignProcess:
          tasks:
            CS_Sign:
              implemented-externally: true
      cockpit:
        workflow-module-uri: http://localhost:8081/c7-cockpit
        ui-uri-type: WEBPACK_MF_REACT
        ui-uri-path: /remoteEntry.js
        i18n-languages: en
        bpmn-description-language: en
        initiator-source: system
